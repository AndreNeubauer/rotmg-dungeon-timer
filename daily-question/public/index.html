<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <title>Daily Question</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <main class="card">
      <p class="eyebrow">Anonymous · one question per day</p>
      <h1 id="question">Loading…</h1>
      <p class="meta" id="meta"></p>

      <form id="form">
        <label for="answer">Answer</label>
        <textarea
          id="answer"
          name="answer"
          rows="5"
          maxlength="2000"
          placeholder="Write whatever comes to mind. Nothing you submit is linked to you."
          required
        ></textarea>
        <div class="actions">
          <button type="submit" id="submit">Submit anonymously</button>
          <button type="button" id="view-answers" class="secondary" hidden>
            View past answers
          </button>
        </div>
      </form>

      <section id="answers-panel" class="answers-panel" hidden>
        <h2>Past answers</h2>
        <pre id="answers-content"></pre>
      </section>

      <p class="status" id="status" aria-live="polite"></p>
      <p class="hint" id="hint">Past answers unlock after you submit today's answer. No names, IPs, or timestamps are stored.</p>
    </main>

    <script>
      const fetchOptions = { referrerPolicy: "no-referrer", credentials: "same-origin" };

      const questionEl = document.getElementById("question");
      const metaEl = document.getElementById("meta");
      const form = document.getElementById("form");
      const answerEl = document.getElementById("answer");
      const statusEl = document.getElementById("status");
      const submitBtn = document.getElementById("submit");
      const viewAnswersBtn = document.getElementById("view-answers");
      const answersPanel = document.getElementById("answers-panel");
      const answersContent = document.getElementById("answers-content");
      const hintEl = document.getElementById("hint");

      function setUnlocked(unlocked) {
        viewAnswersBtn.hidden = !unlocked;
        hintEl.hidden = unlocked;
      }

      async function loadToday() {
        const res = await fetch("/api/today", fetchOptions);
        const data = await res.json();
        questionEl.textContent = data.question;
        metaEl.textContent = data.date;
      }

      async function loadStatus() {
        const res = await fetch("/api/status", fetchOptions);
        const data = await res.json();
        setUnlocked(data.unlocked);
      }

      async function loadAnswers() {
        const res = await fetch("/api/answers", fetchOptions);
        const data = await res.json();
        if (!res.ok || !data.ok) {
          throw new Error(data.error || "Could not load answers");
        }
        answersContent.textContent = data.content.trim() || "No answers yet.";
        answersPanel.hidden = false;
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        submitBtn.disabled = true;
        statusEl.textContent = "Saving…";

        try {
          const res = await fetch("/api/answer", {
            ...fetchOptions,
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ answer: answerEl.value.trim() }),
          });
          const data = await res.json();
          if (!res.ok || !data.ok) {
            throw new Error(data.error || "Could not save answer");
          }
          statusEl.textContent = "Saved anonymously. You can now view past answers.";
          answerEl.value = "";
          setUnlocked(true);
        } catch (error) {
          statusEl.textContent = error.message;
        } finally {
          submitBtn.disabled = false;
        }
      });

      viewAnswersBtn.addEventListener("click", async () => {
        statusEl.textContent = "Loading answers…";
        try {
          await loadAnswers();
          statusEl.textContent = "";
        } catch (error) {
          statusEl.textContent = error.message;
        }
      });

      Promise.all([loadToday(), loadStatus()]).catch(() => {
        questionEl.textContent = "Could not load today’s question.";
      });
    </script>
  </body>
</html>
