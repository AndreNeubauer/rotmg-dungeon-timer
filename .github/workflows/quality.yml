name: Quality checks

on:
  workflow_call:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Test
        run: npm test

      - name: Verify catalog bundle
        run: |
          python3 scripts/build-catalog-js.py
          git diff --exit-code dungeons.js
