<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark" />
  <title>RotMG Timer</title>
  <link rel="stylesheet" href="style.css?v=14" />
</head>
<body>
  <div id="bg-layer" aria-hidden="true"></div>
  <div id="bg-scrim" aria-hidden="true"></div>
  <main>
    <header>
      <h1>RotMG Timer</h1>
      <nav class="tabs">
        <button type="button" class="tab active" data-page="timer">Timer</button>
        <button type="button" class="tab" data-page="overview">Overview</button>
        <button type="button" class="tab" data-page="times">Times</button>
      </nav>
    </header>

    <div id="page-timer" class="page">
      <div class="dungeon-picker">
        <nav class="category-tabs" id="category-tabs" aria-label="Dungeon categories">
          <button type="button" class="category-tab active" data-category="exalt">Exalt</button>
          <button type="button" class="category-tab" data-category="realm">Realm</button>
          <button type="button" class="category-tab" data-category="advanced">Advanced</button>
          <button type="button" class="category-tab" data-category="oryx">Oryx</button>
          <button type="button" class="category-tab" data-category="wormhole">Wormholes</button>
          <button type="button" class="category-tab" data-category="wormhole-adv">Adv. WH</button>
          <button type="button" class="category-tab" data-category="special">Special</button>
          <button type="button" class="category-tab" data-category="heroic">Heroic</button>
          <button type="button" class="category-tab" data-category="other">Other</button>
        </nav>
        <input type="search" id="dungeon-search" placeholder="Search this tab" autocomplete="off" />
        <div id="dungeon-grid" class="dungeon-grid"></div>
      </div>

      <section class="timer-block">
        <p class="dungeon-name" id="dungeon-name">Lost Halls</p>
        <div class="timer" id="timer">—</div>
        <p class="status" id="status"></p>
        <div class="buttons">
          <button type="button" id="start-btn">Start</button>
          <button type="button" id="end-btn">End</button>
        </div>
        <div class="buttons fail-buttons">
          <button type="button" id="nexus-btn">Nexus</button>
          <button type="button" id="died-btn">Died</button>
        </div>
        <div id="post-end-prompt" class="chain-prompt hidden">
          <p class="chain-prompt-label" id="post-end-label"></p>
          <div class="chain-prompt-buttons" id="post-end-actions"></div>
        </div>
      </section>
    </div>

    <div id="page-overview" class="page hidden">
      <div id="overview-hero" class="overview-hero"></div>
      <div id="overview-exalt" class="overview-exalt"></div>
      <section class="overview-section">
        <h2 class="overview-heading">Recent runs</h2>
        <div id="overview-recent" class="overview-recent"></div>
      </section>
    </div>

    <div id="page-times" class="page hidden">
      <div class="times-toolbar">
        <label class="times-filter-label" for="times-dungeon-filter">Dungeon</label>
        <select id="times-dungeon-filter">
          <option value="">All dungeons</option>
        </select>
      </div>
      <div id="stats-summary" class="stats-summary"></div>
      <div id="averages-list" class="averages-list"></div>
      <table class="runs-table">
        <thead>
          <tr>
            <th>When</th>
            <th>Dungeon</th>
            <th>Result</th>
            <th>Time</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="runs-body"></tbody>
      </table>
    </div>
  </main>

  <footer class="app-footer">
    By MeleeOnly — made for collecting data to see how long exalting takes.
  </footer>

  <img id="dungeon-icon" alt="" hidden />
  <span id="dungeon-meta" hidden></span>
  <script src="dungeons.js?v=14"></script>
  <script src="app.js?v=14"></script>
</body>
</html>
