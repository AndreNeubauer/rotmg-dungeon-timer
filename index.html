<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark" />
  <title>RotMG Timer</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main>
    <header>
      <h1>RotMG Timer</h1>
      <nav class="tabs">
        <button type="button" class="tab active" data-page="timer">Timer</button>
        <button type="button" class="tab" data-page="times">Times</button>
      </nav>
    </header>

    <div id="page-timer" class="page">
      <div id="exalt-grid" class="dungeon-grid"></div>

      <details class="accordion" id="all-dungeons-accordion">
        <summary>All dungeons</summary>
        <input type="search" id="dungeon-search" placeholder="Search" autocomplete="off" />
        <div id="all-dungeon-list"></div>
      </details>

      <section class="timer-block">
        <p class="dungeon-name" id="dungeon-name">Lost Halls</p>
        <div class="timer" id="timer">—</div>
        <p class="status" id="status"></p>
        <div class="buttons">
          <button type="button" id="start-btn">Start</button>
          <button type="button" id="end-btn" disabled>End</button>
        </div>
        <div class="buttons fail-buttons">
          <button type="button" id="nexus-btn" disabled>Nexus</button>
          <button type="button" id="died-btn" disabled>Died</button>
        </div>
        <div id="post-end-prompt" class="chain-prompt hidden">
          <p class="chain-prompt-label" id="post-end-label"></p>
          <div class="chain-prompt-buttons" id="post-end-actions"></div>
        </div>
      </section>
    </div>

    <div id="page-times" class="page hidden">
      <div id="averages-list" class="averages-list"></div>
      <table class="runs-table">
        <thead>
          <tr>
            <th>When</th>
            <th>Dungeon</th>
            <th>Time</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="runs-body"></tbody>
      </table>
    </div>
  </main>

  <img id="dungeon-icon" alt="" hidden />
  <span id="dungeon-meta" hidden></span>
  <script src="app.js"></script>
</body>
</html>
